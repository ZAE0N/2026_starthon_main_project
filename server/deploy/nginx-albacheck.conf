# 2026-09-13 실제 배포에 쓴 것은 이 파일이 아니라, 아래 location 블록을
# 기존 사이트 설정(/etc/nginx/sites-available/inhatc)의 443 server 블록 안에
# 넣는 방식입니다. 새 server block 을 만들지 않았습니다.
#
# 이유: 서버에 다른 프로젝트가 같이 돌고 있고 smpsws.shop 인증서가 이미 있어서,
#       새 도메인과 certbot 발급이 불필요했습니다.
#
# ┌── 기존 사이트에 이 블록만 추가 ──────────────────────────────────┐

location ^~ /albacheck/ {
    # 끝의 / 가 있어야 /albacheck/inspect -> /inspect 로 넘어갑니다.
    # 빼면 uvicorn 이 /albacheck/inspect 를 받고 404 를 냅니다.
    proxy_pass http://127.0.0.1:8003/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 기본값 1MB 면 진짜 계약서 사진이 413 으로 막힙니다.
    #   작은 테스트 사진으로는 통과하기 때문에 원인을 찾기가 가장 어렵습니다.
    #
    #   앱서버 한도(MAX_IMAGE_MB=8 x base64 1.4배 ≈ 11MB)보다 높게 잡습니다.
    #   nginx 가 먼저 끊으면 HTML 에러 페이지가 나가고 우리 로그에는 아무것도
    #   남지 않습니다. 우리 쪽에서 413 을 내야 journalctl 로 원인이 보입니다.
    #
    #   location 안에 두었으므로 같은 서버의 다른 사이트에는 영향이 없습니다.
    client_max_body_size 12M;

    # 앱 타임아웃이 45초입니다. 그보다 길게 두어 nginx 가 먼저 끊지 않게 합니다.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# └──────────────────────────────────────────────────────────────────┘
#
# 적용 절차 (순서를 지켜야 기존 사이트가 안 끊깁니다)
#
#   sudo cp -a /etc/nginx /root/nginx-backup-$(date +%F-%H%M)   # 먼저 백업
#   sudo nano /etc/nginx/sites-available/inhatc                 # 블록 추가
#   sudo nginx -t                                               # 반드시 검증
#   sudo systemctl reload nginx                                 # restart 아님
#
# ^~ 를 붙이는 이유: 같은 파일에 `location ~ /\.` 같은 정규식 location 이 있는데,
# ^~ 가 없으면 그쪽이 먼저 잡힐 수 있습니다.
#
# ── 참고: 새 도메인으로 따로 세우는 경우 ─────────────────────────────
# 위 방식이 안 맞으면 아래처럼 독립 server block 을 씁니다.
# 이때는 도메인을 고정 IP 에 연결하고 certbot 으로 인증서를 받아야 합니다.
# 도메인이 없으면 sslip.io (예: 1-2-3-4.sslip.io) 로도 발급됩니다.
#
#   server {
#       listen 80;
#       server_name <도메인>;
#       client_max_body_size 12M;
#       location / {
#           proxy_pass http://127.0.0.1:8003;
#           proxy_set_header Host $host;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_read_timeout 60s;
#       }
#   }
#
#   sudo certbot --nginx -d <도메인>
