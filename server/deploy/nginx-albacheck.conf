# /etc/nginx/sites-available/albacheck 로 복사하고 sites-enabled 에 링크합니다.
#
# 기존에 돌고 있는 다른 앱의 설정 파일은 열지 마세요.
# nginx 는 Host 헤더를 server_name 과 맞춰서 고르므로, 도메인이 다르면 서로 간섭하지 않습니다.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # ★ 이게 없으면 기본값 1MB 라서 진짜 계약서 사진만 413 으로 막힙니다.
    #   작은 테스트 사진으로는 멀쩡히 통과하기 때문에 원인을 찾기가 가장 어렵습니다.
    #
    #   앱 서버 한도(MAX_IMAGE_MB=8, base64 보정 1.4배 ≈ 11MB)보다 살짝 높게 잡습니다.
    #   nginx 가 먼저 끊으면 HTML 에러 페이지가 나가고 우리 로그에는 아무것도 안 남습니다.
    #   우리 쪽에서 413 을 내야 journalctl 로 원인을 볼 수 있습니다.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱 타임아웃이 45초입니다. 그보다 길게 두어 nginx 가 먼저 끊지 않게 합니다.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
